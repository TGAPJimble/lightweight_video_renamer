[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-video-renamer"
version = "0.2.0"
description = "Rename video and image files in place while they display (mpv)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "python-mpv",
    "send2trash",
    "pillow",
    "pillow-heif",
    "rawpy",
    "resvg-py",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
lightweight-video-renamer = "lightweight_video_renamer.app:main"

[tool.setuptools.packages.find]
include = ["lightweight_video_renamer*"]
